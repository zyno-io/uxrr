name: CLA Assistant

# Checks that every pull request author has signed CLA.md.
#
# SECURITY: this workflow runs on pull_request_target, so it has a write token while handling
# pull requests from forks. It must never check out, build, or execute pull request code. The
# CLA action only calls the GitHub API; do not add an actions/checkout step or any `run` step
# that uses pull request content.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions: {}

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'zyno-io/uxrr' && (
        github.event_name == 'pull_request_target' || (
          github.event.issue.pull_request && (
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        )
      )
    permissions:
      actions: write # re-run the failed CLA check after signing
      contents: write # commit signatures to the cla-signatures branch
      pull-requests: write # comment on and lock pull requests
    steps:
      - name: CLA Assistant Lite
        # contributor-assistant/github-action v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/zyno-io/uxrr/blob/main/CLA.md
          # The branch and file must already exist and the branch must not be protected.
          branch: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          # No allowlist: the action matches it against the raw git author name when a commit's
          # email is not linked to a GitHub account, so any entry could be spoofed.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          lock-pullrequest-aftermerge: true
